<!DOCTYPE html>
<html class="passive-overlay-scrollbars" tabindex="0" data-settings-key="ride-leader-games-overlay-v1">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"/>
    <title>Ride Leader Games — Leaderboard</title>
    <script src="/pages/src/preloads.js"></script>
    <link rel="stylesheet" href="/pages/css/common.css"/>
    <link rel="stylesheet" href="overlay.css"/>
    <script type="module">
        import {main} from './overlay.mjs';
        main();
    </script>
</head>
<body>
<!--
  Sauce chrome for a frameless overlay: hidden until you right-click the window (which toggles
  `settings-mode`), then it drops down with working Minimize/Close buttons. Without this block a
  frameless overlay has no way to be closed. See pages/src/common.mjs (contextmenu + #titlebar).
-->
<div id="titlebar">
    <header>
        <div class="logo"><img src="/pages/images/icon128.png"/></div>
        <div class="title">Ride Leader Games</div>
        <div class="filler"></div>
        <div class="buttons">
            <div title="Minimize" class="button minimize electron-only"><ms>minimize</ms></div>
            <div title="Close this window" class="button close electron-only"><ms>close</ms></div>
        </div>
    </header>
</div>
<div class="rlg-overlay">
    <header>
        <span class="title">🏁 Leaderboard</span>
        <span class="clock" id="clock">--:--</span>
    </header>
    <ol id="board" class="board"></ol>
    <div class="empty" id="empty">Waiting for the game to start…</div>
</div>
</body>
</html>
